
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Opportunity | Pathway</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 35px 20px;
            font-family: 'Poppins', sans-serif;
            background: #f8f4fa;
            color: #252B30;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #397f73;
            text-decoration: none;
            font-weight: 600;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 8px 25px rgba(37, 43, 48, 0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-family: inherit;
            font-size: 14px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #70C7B8;
            box-shadow: 0 0 0 3px rgba(112, 199, 184, 0.15);
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 28px;
            flex-wrap: wrap;
        }

        button, .cancel {
            padding: 13px 22px;
            border-radius: 12px;
            border: none;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }

        button {
            background: #70C7B8;
            color: #252B30;
        }

        button:hover {
            background: #58b5a5;
        }

        .cancel {
            background: #eee8f3;
            color: #252B30;
        }

        .flash {
            background: #fff0f3;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            color: #8c4055;
        }

        @media (max-width: 600px) {
            .form-card {
                padding: 22px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a class="back-link" href="{{ url_for('recruiter_opportunities') }}">
        ← Back to My Opportunities
    </a>

    <div class="form-card">

        <h1>✏️ Edit Opportunity</h1>
        <p class="subtitle">
            Update your internship or learnership details below.
        </p>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="flash">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST"
              action="{{ url_for('edit_opportunity', opportunity_id=opportunity.id) }}">

            <label for="position">Opportunity Title *</label>
            <input
                type="text"
                id="position"
                name="position"
                value="{{ opportunity.position }}"
                required
            >

            <label for="location">Location *</label>
            <input
                type="text"
                id="location"
                name="location"
                value="{{ opportunity.location }}"
                required
            >

            <label for="deadline">Application Deadline *</label>
            <input
                type="date"
                id="deadline"
                name="deadline"
                value="{{ opportunity.deadline }}"
                required
            >

            <label for="description">Description *</label>
            <textarea
                id="description"
                name="description"
                required
            >{{ opportunity.description }}</textarea>

            <label for="requirements">Requirements</label>
            <textarea
                id="requirements"
                name="requirements"
            >{{ opportunity.requirements or '' }}</textarea>

            <div class="buttons">
                <button type="submit">💾 Save Changes</button>

                <a class="cancel"
                   href="{{ url_for('recruiter_opportunities') }}">
                    Cancel
                </a>
            </div>

        </form>

    </div>
</div>

</body>
</html>
